name: Release Obsidian plugin

on:
  push:
    tags:
      # Obsidian's community-plugin portal pulls the GitHub release whose
      # tag literally matches manifest.json's `version` field — no "v"
      # prefix allowed.
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  id-token: write       # sign attestations via sigstore
  attestations: write   # publish provenance attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned so `bun audit` and the lockfile behave as they do locally.
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Obsidian's community review flags dependency advisories, dev-only
      # ones included, so fail the release here instead of after review.
      - name: Audit dependencies
        run: bun audit

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Obsidian community review rules)
        run: bun run lint:obsidian

      - name: Build
        run: bun run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes "Automated release. See commit log for details." \
            main.js manifest.json styles.css
