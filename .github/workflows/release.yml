name: Release Obsidian plugin

on:
  push:
    tags:
      # Obsidian's community-plugin portal pulls the GitHub release whose
      # tag literally matches manifest.json's `version` field — no "v"
      # prefix allowed.
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  id-token: write       # sign attestations via sigstore
  attestations: write   # publish provenance attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/checkout@v4 turns the pushed tag into a lightweight one, so
      # fetch the real (annotated) tag object back. Fail before any build.
      - name: Require an annotated tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
          [ "$(git cat-file -t "$TAG_NAME")" = tag ] || { echo "::error::$TAG_NAME is not an annotated tag"; exit 1; }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned so `bun audit` and the lockfile behave as they do locally.
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Obsidian's community review flags dependency advisories, dev-only
      # ones included, so fail the release here instead of after review.
      - name: Audit dependencies
        run: bun audit

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Obsidian community review rules)
        run: bun run lint:obsidian

      - name: Build
        run: bun run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            main.js manifest.json styles.css
